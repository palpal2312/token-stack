version: 1
concurrency: 3
defaults:
  timeout: 30m
  effect: scoped-write
  approval: inherit
  capture: true
jobs:
  - id: lane1-ao10-cleanup
    runtime: cursor
    task: mechanical
    importance: normal
    cwd: C:/Users/ADMIN/orca/workspaces/source/sprint-01-lane-1
    isolation: worktree
    prompt: Clean AO-10 CRLF and path defects, revalidate all rows, and write a hash receipt.
    expected_output: Clean AO-10 JSONL plus validation/hash receipt.
    checks: [JSONL parses, paths classified, no invalid tags]
  - id: lane2-ao26
    runtime: claude-sub2api-02
    task: architecture
    importance: high
    cwd: C:/Users/ADMIN/orca/workspaces/source/sprint-01-lane-2
    isolation: worktree
    prompt: Author AO-26 Card=Run and advisory allocator contract under the ratified Orca-first boundary.
    expected_output: AO-26 contract passing forbidden-pattern and required-token checks.
  - id: lane3-orca-probe-deltas
    runtime: claude-kimicode
    fallback_runtime: [pi]
    task: test
    importance: high
    cwd: C:/Users/ADMIN/orca/workspaces/source/sprint-01-lane-3
    isolation: worktree
    prompt: Execute read-only AO-19 Orca probe, write AO-20 capability receipt and AO-22 gate delta seed.
    expected_output: Probe script, immutable capability receipt, delta JSONL, and checks.
  - id: lane2-pin-ao16
    runtime: claude-sub2api-02
    task: architecture
    importance: high
    cwd: C:/Users/ADMIN/orca/workspaces/source/sprint-01-lane-2
    isolation: worktree
    depends_on: [lane3-orca-probe-deltas]
    prompt: Pin AO-16 to the verified AO-20 version/capability receipt without adding execution authority.
    expected_output: Updated AO-16 plus battery receipt.
  - id: lane3-final-gate
    runtime: claude-kimicode
    fallback_runtime: [pi]
    task: review
    importance: high
    cwd: C:/Users/ADMIN/orca/workspaces/source/sprint-01-lane-3
    isolation: worktree
    depends_on: [lane1-ao10-cleanup, lane2-ao26, lane2-pin-ao16]
    prompt: Independently run the complete Sprint 01 exit gate after controller promotion.
    expected_output: Evidence-backed GO with zero unresolved blockers, or precise NO-GO remediation.
  - id: lane3-final-readonly-regate
    runtime: claude-kimicode
    fallback_runtime: [pi]
    task: review
    importance: high
    cwd: C:/Users/ADMIN/orca/workspaces/source/sprint-01-lane-3
    isolation: worktree
    depends_on: [lane3-final-gate]
    prompt: Re-run the complete Sprint 01 gate read-only after AO-22 v2 promotion and AO-07 rehash.
    expected_output: Independent read-only GO with zero unresolved blockers, or precise NO-GO remediation.
