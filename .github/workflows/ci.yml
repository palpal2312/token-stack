name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_self_hosted:
        description: "Run the isolated self-hosted Docker smoke job"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test

  token-stack-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:token-stack

  go:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./internal/... ./cmd/sen-plane

  tsc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
  canonical-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
      - run: npm ci
      - run: npm run test
      - name: sen-plane canonical smoke
        shell: pwsh
        run: |
          cd go
          go build -o $env:RUNNER_TEMP/sen-plane.exe ./cmd/sen-plane
          $p = Start-Process -FilePath $env:RUNNER_TEMP/sen-plane.exe -PassThru -NoNewWindow -Environment @{ SEN_PLANE_STORE_DIR = "$env:RUNNER_TEMP/sen-plane-store"; SEN_PLANE_ADDR = "127.0.0.1:3979" }
          try {
            Start-Sleep -Seconds 4
            $h = Invoke-RestMethod http://127.0.0.1:3979/healthz
            if ($h.status -ne "ok") { throw "healthz != ok" }
            $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3979/api/v1/sen/chat -ContentType "application/json" -Body '{"session_id":"ci-smoke","sender":"user","text":"ci"}'
            if ($r.turn_seq -lt 1) { throw "turn_seq < 1" }
            Write-Host "canonical-smoke-ok turn=$($r.turn_seq) attempt=$($r.chat_attempt_id)"
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

  container-smoke-github-hosted:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t agent-os-s17 .
      - name: Container smoke
        run: |
          set -euo pipefail
          container_id=""
          body_file="$(mktemp)"
          cleanup() {
            rm -f "$body_file"
            if [ -n "$container_id" ]; then docker rm -f "$container_id" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          container_id="$(docker run -d -p 127.0.0.1::3737 agent-os-s17)"
          port="$(docker port "$container_id" 3737/tcp | awk -F: 'NR == 1 { print $NF }')"
          test -n "$port"
          for _ in $(seq 1 30); do
            status="$(curl -s --connect-timeout 2 --max-time 5 -o "$body_file" -w '%{http_code}' "http://127.0.0.1:${port}/api/orchestration/state?compact=state" || true)"
            if [ "$status" = "200" ] && node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if(v.schemaVersion!==1 || v.error!==null || !v.result || !Array.isArray(v.result.cards)) process.exit(1)' "$body_file"; then
              echo "container-smoke-ok runner=github-hosted container=$container_id port=$port"
              exit 0
            fi
            sleep 1
          done
          echo "container-smoke-failed status=$status container=$container_id port=$port"
          exit 1

  container-smoke-self-hosted:
    runs-on: [self-hosted, newsos-docker-isolated]
    if: github.event_name == 'workflow_dispatch' && inputs.run_self_hosted == true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build -t agent-os-s17 .
      - name: Container smoke
        run: |
          set -euo pipefail
          container_id=""
          body_file="$(mktemp)"
          cleanup() {
            rm -f "$body_file"
            if [ -n "$container_id" ]; then docker rm -f "$container_id" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          container_id="$(docker run -d -p 127.0.0.1::3737 agent-os-s17)"
          port="$(docker port "$container_id" 3737/tcp | awk -F: 'NR == 1 { print $NF }')"
          test -n "$port"
          for _ in $(seq 1 30); do
            status="$(curl -s --connect-timeout 2 --max-time 5 -o "$body_file" -w '%{http_code}' "http://127.0.0.1:${port}/api/orchestration/state?compact=state" || true)"
            if [ "$status" = "200" ] && node -e 'const fs=require("fs"); const v=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if(v.schemaVersion!==1 || v.error!==null || !v.result || !Array.isArray(v.result.cards)) process.exit(1)' "$body_file"; then
              echo "container-smoke-ok runner=self-hosted container=$container_id port=$port"
              exit 0
            fi
            sleep 1
          done
          echo "container-smoke-failed status=$status container=$container_id port=$port"
          exit 1
